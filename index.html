    <p>School Email 是在本機安裝的 OpenClaw 家庭學校郵件助理，供私人家庭使用，不提供公開註冊。</p>
    <h2>用途與授權</h2>
    <p>預計在使用者授權後搜尋 Gmail 郵件、摘要新郵件及擬定草稿。初期預計僅要求 Gmail 唯讀授權；如日後需要寄信，須另行取得所需權限，並在每次寄送前取得擁有人明確確認。</p>
    <p>目前尚未存取郵件。部署者確認 AI 供應商的資料處理方式、保存期限及存取控制前，郵件資料處理將保持停用。</p>
